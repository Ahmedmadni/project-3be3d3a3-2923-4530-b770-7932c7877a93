<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#0ea5a4" />
    <title>مؤشر صحي — دون اتصال</title>
    <style>
      *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f5f8f8;color:#17343d;font-family:system-ui,-apple-system,sans-serif}
      main{max-width:520px;width:100%;background:#fff;border:1px solid #dce8e8;border-radius:28px;padding:32px;text-align:center;box-shadow:0 24px 60px rgba(25,70,75,.10)}
      .icon{width:64px;height:64px;margin:auto;display:grid;place-items:center;border-radius:20px;background:#e5f6f5;color:#087f7d;font-size:28px}
      h1{margin:18px 0 8px;font-size:24px}p{margin:0;color:#60747a;line-height:1.9;font-size:14px}
      button{margin-top:22px;border:0;border-radius:14px;padding:12px 18px;background:#0e9f9d;color:#fff;font-weight:700;cursor:pointer}
      small{display:block;margin-top:18px;color:#839398;line-height:1.7}
    </style>
  </head>
  <body>
    <main>
      <div class="icon">✚</div>
      <h1>أنت غير متصل بالإنترنت</h1>
      <p>يمكن فتح هيكل التطبيق، لكن القياسات والسجل والمعلومات الشخصية لا تُحفظ للاستخدام دون اتصال حفاظًا على الخصوصية.</p>
      <button onclick="location.reload()">إعادة المحاولة</button>
      <small>في حالة طارئة لا تعتمد على التطبيق دون اتصال؛ استخدم خدمات الطوارئ المحلية مباشرة.</small>
    </main>
  </body>
</html>
