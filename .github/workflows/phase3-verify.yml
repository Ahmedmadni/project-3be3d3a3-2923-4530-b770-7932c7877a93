name: Application verification

on:
  push:
    branches:
      - main
      - phase4-readiness
  pull_request:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Tests
        run: bunx vitest run
      - name: Build
        run: bun run build
      - name: TypeScript typecheck
        run: bunx tsc --noEmit

  maternity-rls:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: ci-only-password
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y postgresql-client
      - name: Build synthetic role and user fixtures
        run: psql -v ON_ERROR_STOP=1 -f tests/db/prepare_pregnancy_appointments.sql
      - name: Apply the production-intended Supabase schema
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261112094600_pregnancy_appointments.sql
      - name: Verify anonymous and cross-account access is blocked
        run: psql -v ON_ERROR_STOP=1 -f tests/db/verify_pregnancy_appointments.sql
