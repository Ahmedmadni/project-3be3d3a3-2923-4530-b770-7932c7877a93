name: Pregnancy guest mobile browser acceptance
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  pregnancy-guest-chromium:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      VITE_SUPABASE_URL: https://example.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_guest_only
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_guest_only
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install locked app dependencies
        run: bun install --frozen-lockfile
      - name: Install Playwright test tools in ephemeral CI environment
        run: npm install --no-save --package-lock=false --ignore-scripts @playwright/test@1.56.1
      - name: Install Chromium for browser acceptance
        run: npx playwright install --with-deps chromium
      - name: Test isolated guest-mode pregnancy page at mobile widths
        shell: bash
        run: |
          set -euo pipefail
          bun run dev -- --host 127.0.0.1 --port 4173 >/tmp/pregnancy-guest-vite.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 90); do
            if curl --fail --silent --output /dev/null http://127.0.0.1:4173/pregnancy; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" != "1" ]; then
            cat /tmp/pregnancy-guest-vite.log
            exit 1
          fi
          npx playwright test --config tests/browser/playwright.config.ts
      - name: Upload browser failures for investigation
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pregnancy-guest-browser-failures
          path: |
            test-results/pregnancy-browser
            /tmp/pregnancy-guest-vite.log
          retention-days: 7
          if-no-files-found: ignore
